  primary_candidate: DATE2025_CNN_400MS_RECONSTRUCTED
  candidate_migration_status: frozen_fp32_reference_phase2
  historical_checkpoint_verified: true
  frozen_reference_contract: configs/baseline/frozen_fp32_reference_v1.json
  decision_primary: historical_streaming_0p9_strict
  decision_secondary: argmax_diagnostic_only
  fp32_onnx_status: frozen_reference
  quantization_method: static_post_training_quantization
